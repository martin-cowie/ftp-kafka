[package]
name = "ftp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ftp-server"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4.6.1", features = ["derive"] }
libunftp = { git = "https://github.com/bolcom/libunftp", branch = "master", default-features = false, features = ["ring"] }
rdkafka = "0.39.0"
serde = { version = "1", features = ["derive"] }
shlex = "2.0.1"
slog = "2"
slog-async = "2.8.0"
slog-term = "2.9.2"
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
unftp-core = { git = "https://github.com/bolcom/libunftp", branch = "master" }
