[package]
name = "ftp-server"
version = "0.1.0"
edition = "2021"
description = "An in-memory FTP server that publishes uploaded files to Kafka via a custom SITE SEND command"
license = "Apache-2.0"
repository = "https://github.com/martin-cowie/ftp-kafka"

[[bin]]
name = "ftp-server"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dependencies]
async-trait = "0.1"
bytes = "1"
clap = { version = "4.6.1", features = ["derive"] }
libunftp = { git = "https://github.com/bolcom/libunftp", branch = "master", default-features = false, features = ["ring"] }
rdkafka = "0.39.0"
serde = { version = "1", features = ["derive"] }
shlex = "2.0.1"
slog = "2"
slog-async = "2.8.0"
slog-term = "2.9.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
toml = "1.1.2"
unftp-core = { git = "https://github.com/bolcom/libunftp", branch = "master" }

[dev-dependencies]
tempfile = "3.27.0"
