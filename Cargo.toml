[package]
name = "ftp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ftp-server"
path = "src/main.rs"

[dependencies]
libunftp = { git = "https://github.com/martin-cowie/libunftp", branch = "site-commands", default-features = false, features = ["ring"] }
unftp-core = { git = "https://github.com/martin-cowie/libunftp", branch = "site-commands" }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
bytes = "1"
